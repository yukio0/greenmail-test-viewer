# Builds and tests on Linux and Windows. A second job runs the UI tests, which build leaves out.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Java 21 runs Gradle, and the others run the tests of the version combinations. The last one
      # listed becomes JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      # Gradle uses the JDKs installed above for its toolchains, rather than downloading them.
      - name: Build
        shell: bash
        run: >-
          ./gradlew build
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            */build/reports/tests/
            */build/test-results/
          retention-days: 7

      # Upload the example records as an artifact, as the README tells users to do, so that its
      # steps are tried on every run.
      - name: Upload the email records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: greenmail-test-viewer-${{ matrix.os }}
          path: '**/build/greenmail-test-viewer/'
          retention-days: 7

  ui-test:
    name: UI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            21

      - uses: gradle/actions/setup-gradle@v6

      # The browsers are cached by the version of Playwright and the image of the runner.
      # ImageOS names the image, such as ubuntu24; without it, the system and its version are used.
      - name: Find the version of Playwright
        id: playwright
        shell: bash
        run: |
          echo "version=$(grep '^playwright = "' gradle/libs.versions.toml | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"
          image="${ImageOS:-}"
          if [ -z "$image" ] && [ -r /etc/os-release ]; then
            image="$(. /etc/os-release && echo "$ID$VERSION_ID")"
          fi
          echo "image=${image:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      # Playwright downloads a WebKit for each version of Ubuntu into the same folder, and one
      # restored on another version cannot start.
      - name: Cache the browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Install the system libraries of the browsers
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          ./gradlew :viewer:installPlaywrightDependencies
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64

      - name: UI tests
        shell: bash
        run: >-
          ./gradlew :viewer:uiTest
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}
          path: |
            viewer/build/reports/tests/uiTest*/
            viewer/build/reports/uiTest/
            viewer/build/test-results/uiTest*/
          retention-days: 7
