# Publishes a release when a version tag such as v0.1.0 is pushed: builds and tests, uploads to
# Maven Central, creates the GitHub release with the jar that has all dependencies, and publishes the
# Gradle plugin. The upload to Maven Central is not released by itself: release it by hand on the
# Central Portal after checking it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Java 21 runs Gradle, and the others run the tests of the version combinations. The last one
      # listed becomes JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      # The tag must name the version in build.gradle, such as v0.1.0 for 0.1.0.
      - name: Check the version
        shell: bash
        run: |
          version="$(./gradlew -q :junit-jupiter:properties --property version | sed -n 's/^version: //p')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in build.gradle." >&2
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "A SNAPSHOT version is not released: $version" >&2; exit 1 ;;
          esac

      - name: Build and test
        shell: bash
        run: >-
          ./gradlew build
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload to Maven Central
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew publishToMavenCentral
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" viewer/build/libs/greenmail-test-viewer.jar
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Publish the Gradle plugin
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >-
          ./gradlew :gradle-plugin:publishPlugins
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
