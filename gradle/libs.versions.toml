[versions]
greenmail = "2.1.15"
# JUnit 5 is the last major version that runs on Java 11.
junit = "5.14.4"
assertj = "3.27.7"
# The same versions as GreenMail 2.1.15.
jakarta-mail-api = "2.1.5"
angus-mail = "2.0.5"
jakarta-activation-api = "2.1.4"
angus-activation = "2.0.3"
jsoup = "1.23.2"
# Jackson 3 needs Java 17.
jackson = "2.22.4"
spring-boot = "4.1.2"
# For the UI tests. The workflow reads this line to cache the browsers.
playwright = "1.64.0"
# For the Gradle plugin, and the oldest Gradle version that it supports, for its tests.
plugin-publish = "2.2.1"
gradle-oldest = "8.0"
# For the tests of version combinations. Raise the latest ones when new versions come out. JUnit 5.6
# is the oldest that the tests can check; the extension needs 5.5.
junit-oldest = "5.6.3"
greenmail-oldest = "2.1.0"
junit6 = "6.1.3"
junit-latest = "6.1.3"
greenmail-latest = "2.1.15"
shadow = "9.6.1"
spotless = "8.11.0"
# Pinned instead of Spotless's default, which depends on the Java version that runs Gradle. Needs
# Gradle on Java 21. Raise it on purpose, and commit the reformatting separately from code changes.
google-java-format = "2.0.0"
maven-publish = "0.37.0"

[libraries]
# Libraries without a version take it from the BOM of JUnit or Spring Boot.
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-testkit = { module = "org.junit.platform:junit-platform-testkit" }
junit-oldest-bom = { module = "org.junit:junit-bom", version.ref = "junit-oldest" }
junit6-bom = { module = "org.junit:junit-bom", version.ref = "junit6" }
junit-latest-bom = { module = "org.junit:junit-bom", version.ref = "junit-latest" }
greenmail-oldest = { module = "com.icegreen:greenmail", version.ref = "greenmail-oldest" }
greenmail-junit5-oldest = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail-oldest" }
greenmail-latest = { module = "com.icegreen:greenmail", version.ref = "greenmail-latest" }
greenmail-junit5-latest = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail-latest" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

jakarta-mail-api = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakarta-mail-api" }
angus-mail = { module = "org.eclipse.angus:jakarta.mail", version.ref = "angus-mail" }
jakarta-activation-api = { module = "jakarta.activation:jakarta.activation-api", version.ref = "jakarta-activation-api" }
angus-activation = { module = "org.eclipse.angus:angus-activation", version.ref = "angus-activation" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
